name: Consolidate libultraship branches

on:
  push:
    branches:
      - wind-waker-style-cel-shading
    paths:
      - .github/workflows/consolidate-lib-branches.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0

      - name: Transfer unlit foliage shadow capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/fast/interpreter.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'if (mRdp->toon_shadow && !is_rect && (mRsp->geometry_mode & G_LIGHTING)) {'
          new = 'if (mRdp->toon_shadow && !is_rect) {'

          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1:
              text = text.replace(old, new, 1)
          elif old_count == 0 and new_count >= 1:
              pass
          else:
              raise SystemExit(f'unexpected foliage capture state: old={old_count}, new={new_count}')

          old_comment = '''    // replayed shadow geometry itself runs with toon_shadow cleared, so it is never re-captured. NOTE: this
    // is gated on toon_shadow only (NOT mRdp->toon), so shadows work even when the cel relight is disabled.
'''
          new_comment = '''    // replayed shadow geometry itself runs with toon_shadow cleared, so it is never re-captured. Capture is
    // intentionally independent of G_LIGHTING: tree canopy cards and other unlit silhouette pieces are valid
    // casters whenever the game explicitly arms their display-list stream.
'''
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit production change and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/consolidate-lib-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fast/interpreter.cpp .github/workflows/consolidate-lib-branches.yml
          if git diff --cached --quiet; then
            echo "No source change required"
          else
            git commit -m "Capture unlit foliage in dynamic shadows"
            git push origin HEAD:wind-waker-style-cel-shading
          fi

      - name: Delete consolidated branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          delete_branch() {
            local branch="$1"
            local encoded="${branch//\//%2F}"
            local status
            status=$(curl -sS -L -o /tmp/delete-response -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${encoded}")
            if [ "${status}" != "204" ] && [ "${status}" != "404" ]; then
              cat /tmp/delete-response
              echo "Failed to delete ${branch}: HTTP ${status}"
              exit 1
            fi
            echo "${branch}: HTTP ${status}"
          }

          for branch in \
            temp-unlit-tree-shadow \
            temp-foliage-artifact \
            agent/shadow-hd-trees-light-fill \
            agent/stabilize-shadow-quality \
            agent/fix-shadow-camera-stability-pr \
            agent/dynamic-shadow-map-pcf \
            cleanup-delete-main \
            trigger-lib-celshade-consolidation \
            main; do
            delete_branch "${branch}"
          done
