name: Apply strict DX11 shadow backend

on:
  pull_request:
    branches:
      - wind-waker-style-cel-shading

permissions:
  contents: write

concurrency:
  group: strict-dx11-shadow-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply-build-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/dynamic-shadow-map-pcf
          fetch-depth: 0

      - name: Apply DX11 integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/apply_dx11_shadow_backend.py
          if ($LASTEXITCODE -ne 0) { throw "DX11 patch script failed with exit code $LASTEXITCODE" }
          git diff --check

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build actual DX11 implementation
        shell: pwsh
        env:
          VCPKG_ROOT: D:/a/vcpkg
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:USERPROFILE/.cargo/bin;$env:PATH"
          cmake --no-warn-unused-cli -S . -B build-shadow-map-dx11 -G Ninja `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_BUILD_TYPE:STRING=Release `
            -DUSE_AUTO_VCPKG=ON `
            -DCMAKE_VS_PLATFORM_NAME=x64
          cmake --build build-shadow-map-dx11 --config Release --parallel 10

      - name: Commit validated DX11 backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item tools/apply_dx11_shadow_backend.py -Force
          Remove-Item .github/workflows/apply-dx11-shadow-backend.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement actual DX11 512px shadow map and PCF resolve [dx11-shadow-backend-applied]"
          git push origin HEAD:agent/dynamic-shadow-map-pcf
