name: cleanup-delete-main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - wind-waker-style-cel-shading

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'cleanup-delete-main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy and temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          delete_ref() {
            local branch="$1"
            local status
            status=$(curl -sS -L -o /tmp/delete-response -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${branch}")

            if [ "${status}" != "204" ] && [ "${status}" != "404" ]; then
              cat /tmp/delete-response
              echo "Failed to delete ${branch}: HTTP ${status}"
              exit 1
            fi

            echo "Deleted ${branch} (HTTP ${status})"
          }

          delete_ref main
          delete_ref cleanup-delete-main
