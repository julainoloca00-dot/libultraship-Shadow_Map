name: Apply optimized dynamic shadow map

on:
  push:
    branches:
      - agent/dynamic-shadow-map-pcf

permissions:
  contents: write

concurrency:
  group: dynamic-shadow-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-build-commit:
    if: ${{ !contains(github.event.head_commit.message, '[dynamic-shadow-map-applied]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: pwsh
        run: |
          python tools/apply_dynamic_shadow_map.py
          python -c "from pathlib import Path; p=Path('src/fast/backends/gfx_direct3d11.cpp'); s=p.read_text(encoding='utf-8'); old='#include <cmath>\n'; assert s.count(old)==1; p.write_text(s.replace(old, old+'#include <cfloat>\n', 1), encoding='utf-8')"

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build libultraship Windows x64
        shell: pwsh
        env:
          VCPKG_ROOT: D:/a/vcpkg
        run: |
          $env:PATH = "$env:USERPROFILE/.cargo/bin;$env:PATH"
          cmake --no-warn-unused-cli -S . -B build-shadow-map -G Ninja `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_BUILD_TYPE:STRING=Release `
            -DUSE_AUTO_VCPKG=ON `
            -DCMAKE_VS_PLATFORM_NAME=x64
          cmake --build build-shadow-map --config Release --parallel 10

      - name: Commit validated implementation
        shell: pwsh
        run: |
          Remove-Item tools/apply_dynamic_shadow_map.py -Force
          Remove-Item .github/workflows/apply-dynamic-shadow-map.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement optimized 512px DX11 shadow map with PCF [dynamic-shadow-map-applied]"
          git push origin HEAD:agent/dynamic-shadow-map-pcf
