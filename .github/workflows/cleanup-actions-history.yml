name: Cleanup Actions history

on:
  push:
    branches:
      - wind-waker-style-cel-shading
    paths:
      - .github/workflows/cleanup-actions-history.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wind-waker-style-cel-shading
          fetch-depth: 0

      - name: Delete previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            mapfile -t run_ids < <(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs?per_page=100" \
              | jq -r --arg current "${CURRENT_RUN_ID}" '.workflow_runs[] | select((.id|tostring) != $current) | .id'
            )

            if [ ${#run_ids[@]} -eq 0 ]; then
              break
            fi

            deleted=0
            for run_id in "${run_ids[@]}"; do
              status=$(curl -sS -o /tmp/delete-run-response -w '%{http_code}' \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}")
              if [ "${status}" = "204" ] || [ "${status}" = "404" ]; then
                deleted=$((deleted + 1))
              fi
            done

            if [ "${deleted}" -eq 0 ]; then
              break
            fi
          done

      - name: Remove cleanup workflow from repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-actions-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove all libultraship workflows"
          git push origin HEAD:wind-waker-style-cel-shading

      - name: Schedule deletion of this cleanup run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          cat > /tmp/delete-current-run.sh <<EOF
          #!/usr/bin/env bash
          sleep 20
          for attempt in \$(seq 1 12); do
            status=\$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${CURRENT_RUN_ID}")
            if [ "\${status}" = "204" ] || [ "\${status}" = "404" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 0
          EOF
          chmod +x /tmp/delete-current-run.sh
          RUNNER_TRACKING_ID="" nohup /tmp/delete-current-run.sh >/dev/null 2>&1 </dev/null &
