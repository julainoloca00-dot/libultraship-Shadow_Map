name: consolidate-celshade-branch

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  consolidate:
    if: github.event.pull_request.title == 'Consolidate libultraship celshade branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Keep only the celshade branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/consolidate-celshade-branch.yml
          git commit -m 'Remove temporary branch consolidation workflow'
          git push origin HEAD:main

          git push origin --delete wind-waker-style-cel-shading
          gh api --method POST \
            repos/julainoloca00-dot/libultraship-Shadow_Map/branches/main/rename \
            -f new_name=wind-waker-style-cel-shading

          gh pr close '${{ github.event.pull_request.number }}' \
            --repo julainoloca00-dot/libultraship-Shadow_Map \
            --delete-branch \
            --comment 'Branches consolidadas: somente wind-waker-style-cel-shading permanece.' || true
