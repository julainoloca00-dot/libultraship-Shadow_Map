name: tidy-format-validation

on:
  push:
    branches:
      - agent/stabilize-shadow-quality

permissions:
  contents: write

jobs:
  apply-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-shadow-quality
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
      - name: Format changed shadow files
        run: |
          clang-format-14 -i \
            include/fast/interpreter.h \
            src/fast/interpreter.cpp \
            src/fast/backends/gfx_direct3d11_shadow_map.inc
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/fast/interpreter.h src/fast/interpreter.cpp src/fast/backends/gfx_direct3d11_shadow_map.inc
          if ! git diff --cached --quiet; then
            git commit -m "Format shadow stability changes"
            git push origin HEAD:agent/stabilize-shadow-quality
          fi
