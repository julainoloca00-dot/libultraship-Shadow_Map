name: build-validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-world-shadow-casters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply source transformation
        run: python tools/apply_world_shadow_casters.py
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/fast/backends/gfx_rendering_api.h include/fast/backends/gfx_direct3d_common.h \
                  include/fast/interpreter.h src/fast/interpreter.cpp \
                  src/fast/backends/gfx_direct3d11_shadow_map.inc
          git commit -m "Add stable environment shadow casters"
          git push origin HEAD:${{ github.head_ref }}
