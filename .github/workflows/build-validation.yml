name: build-validation

on:
  push:
    branches:
      - agent/stabilize-shadow-quality

permissions:
  contents: write

jobs:
  apply-shadow-stability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-shadow-quality
          fetch-depth: 0
      - name: Apply source transformation
        run: python tools/apply_shadow_stability_quality.py
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/fast/interpreter.h src/fast/interpreter.cpp src/fast/backends/gfx_direct3d11_shadow_map.inc
          git commit -m "Stabilize and sharpen dynamic shadows"
          git push origin HEAD:agent/stabilize-shadow-quality
